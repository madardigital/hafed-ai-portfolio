name: Import portfolio images

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download portfolio images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content-customer-service/images/content
          mkdir -p content-customer-service/images/reports
          mkdir -p content-customer-service/images/canva

          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-6a70-822f-a729-bbb1fec8aba7/raw?se=2026-07-31T18:44:18Z&sp=r&sv=2026-02-06&sr=b&scid=8082bd14-ed8b-5f51-98d8-51839b6ffa8c&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T13:17:47Z&ske=2026-08-02T13:17:47Z&sks=b&skv=2026-02-06&sig=mRSKYSOa9FuL3n0tzYT0c%2BxePLmWzNpn8LHmvUVtTrU%3D' -o content-customer-service/images/content/festival-preview.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-58e8-822f-b6fb-9cf41ea8eff7/raw?se=2026-07-31T18:44:26Z&sp=r&sv=2026-02-06&sr=b&scid=b39c5c29-5936-5050-b748-816f7ef3d6db&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T12:47:51Z&ske=2026-08-02T12:47:51Z&sks=b&skv=2026-02-06&sig=QxV6Dv6v1SE3SifJfje6nCDhBW0VzjyyXS3%2B4yx9YQ8%3D' -o content-customer-service/images/content/hajj-preview.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-9954-822f-a603-e864d6da4234/raw?se=2026-07-31T18:42:46Z&sp=r&sv=2026-02-06&sr=b&scid=9be6a40c-1e8d-5692-a8ed-ae64c42ba63d&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T13:17:19Z&ske=2026-08-02T13:17:19Z&sks=b&skv=2026-02-06&sig=%2BehHNRJz7U5329eO/SibJK7Ln4UEVPTfaPcyiDL%2BFfU%3D' -o content-customer-service/images/reports/press-news-preview.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-78d4-822f-90e9-7bdcb57f3aff/raw?se=2026-07-31T18:41:06Z&sp=r&sv=2026-02-06&sr=b&scid=f3e1845a-13fb-5bd5-970b-d01e6403eb6d&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:50:26Z&ske=2026-08-01T22:50:26Z&sks=b&skv=2026-02-06&sig=yh8v0TOlK9EQdn4gqOm/wl3540rvbkXYnJ9exdGhvhw%3D' -o content-customer-service/images/canva/aware-newsletter.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-42b0-822f-9d82-6fe9a5a6caec/raw?se=2026-07-31T18:41:21Z&sp=r&sv=2026-02-06&sr=b&scid=ea83926f-f2f6-54f3-bb75-a5c3df6d745a&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-31T11:13:02Z&ske=2026-08-02T11:13:02Z&sks=b&skv=2026-02-06&sig=QR2ufKYf9vgPaz4rgGHkkW%2BhZhlSG3VBDZ2peoY78OA%3D' -o content-customer-service/images/canva/digital-balance.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-619c-822f-bb46-484a95040644/raw?se=2026-07-31T18:41:35Z&sp=r&sv=2026-02-06&sr=b&scid=9103e0d6-abab-5719-b2ed-288f38398180&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:48:27Z&ske=2026-08-01T22:48:27Z&sks=b&skv=2026-02-06&sig=NnRPhK6/jaWPevUBd%2B6GdxKZsaIKpyJPIvDfkwc2E1c%3D' -o content-customer-service/images/canva/barns-coffee.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-5b50-822f-9bc9-ec81d846503e/raw?se=2026-07-31T18:41:47Z&sp=r&sv=2026-02-06&sr=b&scid=89095a9d-1bdd-5a18-877c-ba13c99be2ed&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:52:24Z&ske=2026-08-01T22:52:24Z&sks=b&skv=2026-02-06&sig=9j2Gmd4K7cSJCPL4b7a0EfwWGHJwfxZURs%2BdgqZZtH8%3D' -o content-customer-service/images/canva/nano-medicine.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-fb44-822f-93fe-cc8ca521012b/raw?se=2026-07-31T18:42:00Z&sp=r&sv=2026-02-06&sr=b&scid=65a046c0-7d0f-5778-8ec0-fa2a4943433d&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:54:17Z&ske=2026-08-01T22:54:17Z&sks=b&skv=2026-02-06&sig=8uGjBItGEWWV/jji6amrHb8M63rbSQyhZxsNSZSmFyk%3D' -o content-customer-service/images/canva/nike-marketing.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-5690-822f-8257-e2587a586fb8/raw?se=2026-07-31T18:42:12Z&sp=r&sv=2026-02-06&sr=b&scid=173ba542-0361-5a80-a407-abbf6e66085b&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:52:24Z&ske=2026-08-01T22:52:24Z&sks=b&skv=2026-02-06&sig=h7AhU5c1DL3v43s4DcAMI8LutSMh5F0TB566ZuFma%2BU%3D' -o content-customer-service/images/canva/radiology-plan.jpg
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-60a8-822f-b5da-d4f19af3ded2/raw?se=2026-07-31T18:42:28Z&sp=r&sv=2026-02-06&sr=b&scid=ae1139ed-f46f-5301-a398-908080f47c57&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T22:48:34Z&ske=2026-08-01T22:48:34Z&sks=b&skv=2026-02-06&sig=Iy1e1NVF%2BHfMkGsNngRhe4Guia1/ulDip%2BMMNWDRNbE%3D' -o content-customer-service/images/canva/educational-trip.jpg

          for f in $(find content-customer-service/images -type f -name '*.jpg'); do
            test -s "$f"
            test "$(head -c 2 "$f" | od -An -t x1 | tr -d ' ')" = 'ffd8'
          done

      - name: Commit imported images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-customer-service/images
          git commit -m 'Import portfolio image assets'
          git push
